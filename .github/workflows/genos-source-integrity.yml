name: GenOS V3 source integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GenOSWork
        uses: actions/checkout@v7
        with:
          path: GenOSWork
          persist-credentials: false
      - name: Check out current GenOS V3
        uses: actions/checkout@v7
        with:
          repository: PISSARAW/GenOS
          ref: v3
          fetch-depth: 0
          path: GenOS
          token: ${{ secrets.GENOS_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: GenOSWork/package-lock.json
      - name: Install site dependencies
        run: npm ci
        working-directory: GenOSWork
      - name: Compare claims with GenOS V3
        run: npx vitest run src/site-integrity
        working-directory: GenOSWork
